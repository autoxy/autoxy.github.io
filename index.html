<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>荒唐满纸 | 极客个人主页 · 瞬移留言板</title>
    <!-- 引入字体与图标库 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0a0f2a, #03050b);
            min-height: 100vh;
            color: #eef5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 动态流动光晕背景 (酷炫粒子感) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 40%, rgba(59,130,246,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(168,85,247,0.1) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        /* 漂浮网格线条 */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(59,130,246,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* 主卡片容器: 玻璃态 + 中央聚焦 */
        .hero-card {
            position: relative;
            z-index: 10;
            max-width: 1300px;
            width: 100%;
            background: rgba(12, 18, 34, 0.55);
            backdrop-filter: blur(14px);
            border-radius: 2.5rem;
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(0, 200, 255, 0.2) inset;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .hero-card:hover {
            border-color: rgba(59, 130, 246, 0.7);
            box-shadow: 0 35px 60px rgba(0, 0, 0, 0.6), 0 0 20px rgba(59, 130, 246, 0.3);
        }

        /* 双栏布局: 左侧个人简介 + 右侧留言板 (桌面端并排) */
        .dashboard {
            display: flex;
            flex-wrap: wrap;
        }

        /* 左侧身份区 (酷炫光泽) */
        .profile-area {
            flex: 1.2;
            padding: 2.2rem 2rem;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(4px);
            border-right: 1px solid rgba(59, 130, 246, 0.3);
            text-align: center;
        }

        /* 右侧留言板核心 */
        .message-area {
            flex: 2;
            padding: 2rem 2rem 2rem 2rem;
        }

        /* 头像容器 */
        .avatar-neon {
            width: 128px;
            height: 128px;
            margin: 0 auto 1.2rem;
            background: linear-gradient(135deg, #1e2a6b, #0a0f2a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #3b82f6;
            box-shadow: 0 0 25px #3b82f6aa, inset 0 0 8px rgba(255,255,255,0.3);
            transition: 0.2s;
        }
        .avatar-neon i {
            font-size: 4.2rem;
            color: #90caf9;
            filter: drop-shadow(0 0 6px #3b82f6);
        }
        .avatar-neon:hover {
            transform: scale(1.02);
            box-shadow: 0 0 35px #3b82f6;
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 800;
            background: linear-gradient(130deg, #FFFFFF, #7aa2f7, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 0.3rem;
        }
        .glow-text {
            font-size: 0.9rem;
            font-weight: 500;
            background: #1e2f50b3;
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            margin-bottom: 1.5rem;
        }
        .bio {
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 1rem 0 1.8rem;
            opacity: 0.85;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-top: 1rem;
        }
        .social-icon {
            background: rgba(59, 130, 246, 0.15);
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            font-size: 1.5rem;
            color: #cbdffc;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }
        .social-icon:hover {
            background: #3b82f6;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 8px 18px rgba(59,130,246,0.5);
            border-color: white;
        }

        /* 留言板头部 */
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1.6rem;
            border-bottom: 1px dashed #3b82f680;
            padding-bottom: 0.6rem;
        }
        .board-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .board-header h2 i {
            color: #3b82f6;
            text-shadow: 0 0 5px #3b82f6;
        }
        .msg-badge {
            background: #14223d;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 留言列表容器 (动态渲染) */
        .message-list {
            max-height: 360px;
            overflow-y: auto;
            padding-right: 6px;
            margin-bottom: 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message-list::-webkit-scrollbar {
            width: 4px;
        }
        .message-list::-webkit-scrollbar-track {
            background: #0f1a2e;
            border-radius: 8px;
        }
        .message-list::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 8px;
        }

        /* 单条留言卡片 */
        .msg-item {
            background: rgba(20, 30, 55, 0.6);
            backdrop-filter: blur(6px);
            border-radius: 1.2rem;
            padding: 0.9rem 1.2rem;
            border-left: 4px solid #3b82f6;
            transition: all 0.2s;
        }
        .msg-item:hover {
            transform: translateX(5px);
            background: rgba(35, 50, 85, 0.8);
            border-left-color: #60a5fa;
        }
        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 6px;
            gap: 8px;
        }
        .msg-name {
            font-weight: 700;
            color: #b9dcff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .msg-name i {
            font-size: 0.75rem;
            background: #3b82f620;
            padding: 4px;
            border-radius: 50%;
        }
        .msg-time {
            font-size: 0.65rem;
            font-family: monospace;
            color: #9ab3d4;
        }
        .msg-content {
            font-size: 0.9rem;
            line-height: 1.45;
            word-break: break-word;
            padding-left: 0.2rem;
        }

        /* 表单区 */
        .form-group {
            margin-top: 0.5rem;
        }
        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .input-field {
            flex: 1;
            background: rgba(5, 10, 25, 0.7);
            border: 1px solid #2c3f6e;
            border-radius: 2.5rem;
            padding: 0.8rem 1.2rem;
            color: white;
            font-family: 'Inter', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 12px #3b82f6aa;
            background: #0a1122;
        }
        textarea.input-field {
            border-radius: 1.5rem;
            resize: vertical;
            min-height: 85px;
        }
        .send-btn {
            background: linear-gradient(95deg, #1e3a8a, #3b82f6);
            border: none;
            padding: 0.8rem 2.2rem;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 0.95rem;
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.2s;
            box-shadow: 0 6px 14px rgba(59,130,246,0.4);
        }
        .send-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(95deg, #2563eb, #609cfa);
            box-shadow: 0 8px 22px #3b82f6;
        }
        .send-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        .toast-msg {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2a48e6;
            backdrop-filter: blur(12px);
            padding: 0.7rem 1.6rem;
            border-radius: 60px;
            border-left: 4px solid #3b82f6;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 200;
            color: white;
            pointer-events: none;
            transition: 0.2s;
            white-space: nowrap;
            font-family: monospace;
        }
        footer {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.7rem;
            opacity: 0.6;
            border-top: 1px solid #2f4172;
            padding-top: 1rem;
        }

        @media (max-width: 820px) {
            .profile-area {
                border-right: none;
                border-bottom: 1px solid #3b82f660;
                padding: 1.5rem;
            }
            .hero-card {
                border-radius: 2rem;
            }
            .board-header h2 {
                font-size: 1.5rem;
            }
        }
        .empty-message {
            text-align: center;
            padding: 2rem;
            opacity: 0.7;
            background: rgba(0,0,0,0.2);
            border-radius: 2rem;
            font-style: italic;
        }
        button i {
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="hero-card">
    <div class="dashboard">
        <!-- 左侧个人展示 -->
        <div class="profile-area">
            <div class="avatar-neon">
                <i class="fas fa-user-astronaut"></i>
            </div>
            <h1>荒唐满纸 · FZT</h1>
            <div class="glow-text">
                <i class="fas fa-code-branch"></i> 全栈炼金术士
            </div>
            <div class="bio">
                构建数字体验，探索前端边界。<br>
                热衷科幻美学 & 交互艺术。<br>
                你的每一条留言都将瞬移到我的邮箱 ✨
            </div>
            <div class="social-links">
                <a href="#" class="social-icon" target="_blank"><i class="fab fa-github"></i></a>
                <a href="#" class="social-icon" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="#" class="social-icon" target="_blank"><i class="fab fa-discord"></i></a>
                <a href="#" class="social-icon" target="_blank"><i class="fas fa-envelope"></i></a>
            </div>
        </div>

        <!-- 右侧留言板 (核心功能) -->
        <div class="message-area">
            <div class="board-header">
                <h2><i class="fas fa-comment-dots"></i> 清风无痕 留言板</h2>
                <span class="msg-badge"><i class="fas fa-envelope-open-text"></i> 瞬移到 站长的foxmail邮箱</span>
            </div>
            <!-- 动态留言列表 -->
            <div id="messageListContainer" class="message-list">
                <!-- 留言会动态渲染 -->
                <div class="empty-message">
                    <i class="fas fa-meteor"></i> 暂无留言 · 刷新即消散<br>
                    写下星际寄语，发送后我会收到邮件～
                </div>
            </div>

            <!-- 留言输入表单 -->
            <div class="form-group">
                <div class="input-row">
                    <input type="text" id="guestName" class="input-field" placeholder="✨ 你的代号 / 昵称" maxlength="30" autocomplete="off">
                </div>
                <div class="input-row">
                    <textarea id="guestMessage" class="input-field" rows="2" placeholder="写下你的想法、建议或奇思妙想... 留言将实时展示，刷新后自动消失，但会飞入我的邮箱 📬" maxlength="280"></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end;">
                    <button id="submitMessageBtn" class="send-btn"><i class="fas fa-paper-plane"></i> 发送留言 & 邮件</button>
                </div>
                <div style="font-size:0.7rem; margin-top: 0.7rem; text-align:right; opacity:0.6;">
                    <i class="fas fa-database"></i> 留言不储存 · 刷新即清风
                </div>
            </div>
            <footer>
                <i class="fas fa-globe"></i> 部署于 GitHub Pages · 光速回响
            </footer>
        </div>
    </div>
</div>

<script>
    // ---------- 留言板核心: 纯前端内存数组，刷新后自动丢失 ----------
    let messagesArray = [];   // 存储 { id, name, content, timestamp }
    let nextId = 1;

    // 获取DOM元素
    const messageContainer = document.getElementById('messageListContainer');
    const nameInput = document.getElementById('guestName');
    const msgInput = document.getElementById('guestMessage');
    const submitBtn = document.getElementById('submitMessageBtn');

    // 辅助函数: 格式化时间 (本地时间字符串)
    function getCurrentTimeString() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    // 简单的XSS防护 (转义HTML特殊字符)
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // 渲染留言列表 (完全基于内存数组)
    function renderMessages() {
        if (!messageContainer) return;
        if (messagesArray.length === 0) {
            messageContainer.innerHTML = `
                <div class="empty-message">
                    <i class="fas fa-meteor"></i> 暂无留言 · 刷新即消散<br>
                    写下星际寄语，发送后我会收到邮件～
                </div>
            `;
            return;
        }
        // 按时间倒序展示（最新的在上面）
        const sorted = [...messagesArray].reverse();
        let html = '';
        for (let msg of sorted) {
            const safeName = escapeHtml(msg.name) || '匿名星辰';
            const safeContent = escapeHtml(msg.content);
            const time = msg.timestamp || '刚刚';
            html += `
                <div class="msg-item">
                    <div class="msg-header">
                        <div class="msg-name"><i class="fas fa-comment"></i> ${safeName}</div>
                        <div class="msg-time"><i class="far fa-calendar-alt"></i> ${time}</div>
                    </div>
                    <div class="msg-content">${safeContent}</div>
                </div>
            `;
        }
        messageContainer.innerHTML = html;
        // 滚动到顶部，方便看到最新留言
        if (messageContainer.scrollTo) messageContainer.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 添加一条本地留言 (仅前端显示)
    function addLocalMessage(name, content) {
        const newMsg = {
            id: nextId++,
            name: name.trim() === "" ? "星尘漫游者" : name.trim(),
            content: content.trim(),
            timestamp: getCurrentTimeString()
        };
        messagesArray.push(newMsg);
        // 限制最多保留50条留言防止过多占用内存（仍然满足刷新消失）
        if (messagesArray.length > 50) messagesArray.shift();
        renderMessages();
    }

    // 显示提示浮层 (toast)
    let toastTimeout = null;
    function showToast(message, isError = false) {
        const existingToast = document.querySelector('.toast-msg');
        if (existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerHTML = isError ? `<i class="fas fa-exclamation-triangle"></i> ${message}` : `<i class="fas fa-check-circle"></i> ${message}`;
        toast.style.background = isError ? '#a1222ae6' : '#1f2a48e6';
        toast.style.borderLeftColor = isError ? '#ff5e7c' : '#3b82f6';
        document.body.appendChild(toast);
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            if (toast && toast.remove) toast.remove();
        }, 3500);
    }

    // ----- 发送邮件 (通过 formsubmit.co, 无需数据库，直发 fzt@foxmail.com) -----
    // 使用免费的 formsubmit AJAX 接口，接收邮箱: fzt@foxmail.com
    async function sendEmailToOwner(name, messageContent) {
        const finalName = (name && name.trim()) ? name.trim() : "匿名星际旅人";
        const finalMessage = messageContent ? messageContent.trim() : "(无内容)";
        // 构建 FormData
        const formData = new FormData();
        // 重要：指定接收邮箱已在 URL 中体现，这里只需要添加自定义字段
        formData.append('name', finalName);
        formData.append('message', finalMessage);
        formData.append('_subject', `✨ 个人主页新留言 - 来自 ${finalName}`);
        formData.append('_captcha', 'false');      // 禁用验证码，提升体验
        // 可选: 添加自动回复（不需要设置回复地址）
        // 使用 formsubmit.co 的 ajax 端点
        try {
            const response = await fetch('https://formsubmit.co/ajax/fzt@foxmail.com', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if (response.ok && result.success !== false) {
                // 成功
                return true;
            } else {
                console.warn('邮件发送返回异常:', result);
                return false;
            }
        } catch (err) {
            console.error('邮件发送请求失败:', err);
            return false;
        }
    }

    // 提交留言的主要逻辑: 添加到本地展示 + 异步发送邮件 (刷新后本地留言消失，符合需求)
    let isSubmitting = false;
    async function handleSubmitMessage() {
        if (isSubmitting) {
            showToast("请稍后，留言正在传输中...", false);
            return;
        }
        let guestName = nameInput.value.trim();
        let guestMsg = msgInput.value.trim();
        if (!guestMsg) {
            showToast("❄️ 请留下一些星辰寄语～", true);
            return;
        }
        if (guestName.length > 30) guestName = guestName.slice(0, 30);
        if (guestMsg.length > 280) guestMsg = guestMsg.slice(0, 280);
        const finalName = guestName === "" ? "星尘旅人" : guestName;
        
        // 1. 立即添加到本地留言列表 (前端内存，刷新即消失)
        addLocalMessage(finalName, guestMsg);
        
        // 2. 清空输入框 (保留昵称可选不删？但为了体验，清空留言内容，昵称保留方便连续留言)
        msgInput.value = "";
        // 如果昵称不为空但不清空昵称，保留便于连续留言 (舒适)
        // 但可以保留焦点
        msgInput.focus();
        
        // 显示发送中的状态
        const originalBtnText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 瞬移邮件中...';
        
        // 3. 异步发送邮件到 fzt@foxmail.com (即使失败也不影响前端显示)
        let emailSuccess = false;
        try {
            emailSuccess = await sendEmailToOwner(finalName, guestMsg);
        } catch (e) {
            console.error(e);
            emailSuccess = false;
        }
        
        // 恢复按钮
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalBtnText;
        
        if (emailSuccess) {
            showToast(`📧 留言已送达站长邮箱！ (刷新后留言将清空)`, false);
        } else {
            showToast(`⚠️ 邮件发送失败，但留言已在此展示。可稍后重试或直接联系站长。`, true);
            // 仍然提示失败但本地留言保留
        }
        isSubmitting = false;
    }

    // 事件绑定
    if (submitBtn) {
        submitBtn.addEventListener('click', (e) => {
            e.preventDefault();
            handleSubmitMessage();
        });
    }
    
    // 可选：回车快捷提交 (ctrl+enter 或 cmd+enter 提交)
    msgInput.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            handleSubmitMessage();
        }
    });
    
    // 初始化渲染 (messagesArray 为空，显示空状态)
    renderMessages();
